<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>Yudh</title>
    <link rel="stylesheet" href="css/turf.css" />
    <style>
      /* ゲーム中の一言の帯(320×76 の透けない窓):混凝土の地に、左の縁が姿勢の色、「站起来」/「坐下」と一行 */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #292c2f;
        cursor: default;
      }
      .note {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px 0 0;
        transition: opacity 0.2s ease-in;
      }
      body.leaving .note {
        opacity: 0;
      }
      .edge {
        align-self: stretch;
        width: 8px;
        background: var(--teal);
      }
      .edge.sit {
        background: var(--text-2);
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        flex: 1;
      }
      .top {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .word {
        font-family: "Yudh CJK", var(--mixed);
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.04em;
        color: var(--teal);
      }
      .word.sit {
        color: var(--white);
      }
      .meta {
        font-family: var(--mixed);
        font-size: 13px;
        font-weight: 700;
        color: var(--text-2);
        white-space: nowrap;
      }
      .line {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="note" class="note"></div>
    <script type="module" src="js/note.js"></script>
  </body>
</html>
