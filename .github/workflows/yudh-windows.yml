# Yudh for Windows:核のテスト(Linux)と、Windows のインストーラー(NSIS)を作る。
# できたインストーラーは Actions の実行ページの Artifacts「Yudh-Windows-setup」からダウンロードする
name: Yudh for Windows

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "杂/yudh-win/**"
      - "杂/nippo/Resources/Material/**"
      - "杂/nippo/Resources/Fonts/**"
      - ".github/workflows/yudh-windows.yml"
  workflow_dispatch:

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 杂/yudh-win
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 杂/yudh-win
      - run: cargo test -p yudh-core
      - run: cargo clippy -p yudh-core --all-targets -- -D warnings

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 杂/yudh-win/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 杂/yudh-win
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Yudh-Windows-setup
          path: 杂/yudh-win/target/release/bundle/nsis/*.exe
          if-no-files-found: error
