<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Yudh のアプリアイコン v3:目覚まし時計くん。
    ラバーホース(パイカットの目)× スプラトゥーン(インクの飛び散り)× ネオブルータリズム(太い墨線・固い影)
    × ガラス(上半分のつや)。要素は少なく、16px でも「緑に黄色のインク、白い顔」と読めるように。
    macOS のアイコン格子(1024 の中に 824 角の角丸、角半径 185)に合わせてある。
    書き出しは scripts/make-icon.mjs(PNG → AppIcon.icns)
  -->
  <defs>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FE27E"/>
      <stop offset="1" stop-color="#1CB957"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <g clip-path="url(#squircle)">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

      <!-- インクの飛び散り(黄)とピンクのしずく -->
      <g fill="#FFD60A" transform="rotate(-8 512 540)"><path d="M809.9 511.4 Q879.5 559.3 798.6 580.8 Q717.6 602.4 752.7 683.4 Q787.7 764.3 722.4 761.2 Q657.0 758.2 629.2 819.0 Q601.4 879.8 526.4 830.9 Q451.5 781.9 397.7 794.2 Q343.9 806.5 341.2 758.4 Q338.5 710.2 259.6 662.1 Q180.6 614.0 211.2 576.0 Q241.9 537.9 215.4 500.3 Q188.9 462.8 253.5 422.8 Q318.1 382.9 319.5 318.4 Q321.0 254.0 403.5 277.9 Q486.1 301.8 521.9 268.0 Q557.7 234.3 592.1 300.7 Q626.4 367.1 712.2 348.1 Q798.0 329.2 769.1 396.3 Q740.2 463.5 809.9 511.4 Z"/><circle cx="324.6" cy="898.0" r="31.6"/><circle cx="130.1" cy="339.8" r="36.0"/><circle cx="809.5" cy="756.2" r="23.3"/><rect x="402.5" y="697.5" width="61.7" height="160.7" rx="30.8"/><circle cx="433.3" cy="858.2" r="46.2"/></g>
      <g fill="#FF4FA3">
        <circle cx="820" cy="770" r="26"/>
        <circle cx="200" cy="222" r="16"/>
      </g>

      <!-- 固い影(右下にずらした墨) -->
      <g fill="#111111" transform="translate(20 20)">
        <path d="M268 360 A108 108 0 0 1 430 214 Z" transform="rotate(-8 350 290)"/>
        <path d="M756 360 A108 108 0 0 0 594 214 Z" transform="rotate(8 674 290)"/>
        <circle cx="512" cy="540" r="212"/>
      </g>

      <!-- ベル(ピンクのドーム)と打ち金 -->
      <g stroke="#111111" stroke-width="22" stroke-linejoin="round">
        <path d="M512 300 L512 262" stroke-linecap="round"/>
        <circle cx="512" cy="248" r="24" fill="#FF4FA3"/>
        <path d="M268 360 A108 108 0 0 1 430 214 Z" fill="#FF4FA3" transform="rotate(-8 350 290)"/>
        <path d="M756 360 A108 108 0 0 0 594 214 Z" fill="#FF4FA3" transform="rotate(8 674 290)"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.7">
        <path d="M300 300 Q318 262 356 246"/>
        <path d="M668 246 Q704 256 724 290"/>
      </g>

      <!-- 顔 -->
      <circle cx="512" cy="540" r="212" fill="#FFFFFF" stroke="#111111" stroke-width="24"/>
      <g fill="#111111">
        <ellipse cx="456" cy="506" rx="34" ry="56"/>
        <ellipse cx="568" cy="506" rx="34" ry="56"/>
      </g>
      <g fill="#FFFFFF">
        <path d="M462 494 L494 460 L475 452 Z"/>
        <path d="M574 494 L606 460 L587 452 Z"/>
      </g>
      <g fill="#FF4FA3" opacity="0.85">
        <ellipse cx="398" cy="596" rx="28" ry="16"/>
        <ellipse cx="626" cy="596" rx="28" ry="16"/>
      </g>
      <path d="M446 604 Q512 660 578 604" fill="none" stroke="#111111" stroke-width="24" stroke-linecap="round"/>

      <!-- ガラスのつや -->
      <rect x="100" y="100" width="824" height="460" fill="url(#sheen)"/>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  </g>
</svg>
