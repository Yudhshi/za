<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Yudh stencil icon set · 24×24 · every icon reads as a hand-cut stencil: parts are separated by
       ~1.5 px "bridges", no outlines, butt ends. Use fill/stroke = currentColor. Copy these <symbol>s
       inline into a page (external <use> does not load over file://). -->
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M2 6.5h12.5v11H2z" fill="currentColor"/><path d="M16 10.2l6-3.7v11l-6-3.7z" fill="currentColor"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M7.3 6.4A8 8 0 1 0 16.7 6.4"/><path d="M12 2v8.2"/></symbol>
  <symbol id="i-seat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M6.5 2.5v9"/><path d="M6.5 14h12"/><path d="M8 16.5V22"/><path d="M17 16.5V22"/></symbol>
  <symbol id="i-stand" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.6" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M12 8.2v6.3"/><path d="M6.5 10.3h3.6"/><path d="M13.9 10.3h3.6"/><path d="M11 16.4l-2.8 5.6"/><path d="M13 16.4l2.8 5.6"/></g></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M2.5 8.5h4.2L12 4v16l-5.3-4.5H2.5z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt"><path d="M15 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M17.8 5.8a8.6 8.6 0 0 1 0 12.4"/></g></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12.8 1.8c.8 4.2 6.2 6.4 6.2 12.4a7 7 0 0 1-14 0c0-3.2 1.8-5.4 3.2-7.2.1 2.6 1.1 3.8 2.3 4.4-.1-4 .9-6.8 2.3-9.6z" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6.5 3.5L20 12 6.5 20.5z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="butt"><path d="M3.5 12.6l4.6 4.6"/><path d="M10.2 16.9L20.6 6.5"/></symbol>
  <symbol id="i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="butt"><path d="M4.5 4.5l6.2 6.2"/><path d="M13.3 13.3l6.2 6.2"/><path d="M19.5 4.5l-6.2 6.2"/><path d="M10.7 13.3l-6.2 6.2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.1 2.5L8.6 8.8 2 9.3l5.1 4.3-1.6 6.6 5.6-3.5z" fill="currentColor"/><path d="M12.9 2.5l2.5 6.3 6.6.5-5.1 4.3 1.6 6.6-5.6-3.5z" fill="currentColor"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M2.5 8.2L8.6 3v10.4z" fill="currentColor"/><path d="M10.4 8.2h4.4a5.3 5.3 0 0 1 0 10.6H7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M2.5 10.5h12.4v3H2.5z" fill="currentColor"/><path d="M16.4 5.5L22 12l-5.6 6.5z" fill="currentColor"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="butt"><path d="M12 2.8a9.2 9.2 0 1 1-6.5 2.7"/><path d="M12 7v5.2l3.4 2.4"/></symbol>
