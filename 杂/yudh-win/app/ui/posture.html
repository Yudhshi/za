<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>Yudh</title>
    <link rel="stylesheet" href="css/turf.css" />
    <style>
      body {
        color: var(--kraft-text);
      }
      .wrap {
        position: relative;
        width: 360px;
        margin: 4px 14px 30px 14px;
        padding-top: 16px;
      }
      /* 出場:胶带の所から紙が下へ広がる(150 ms。最初の中身を描いたときに entering を付ける)。閉じるときは揭がす */
      .sheet {
        transform-origin: 50% 0;
      }
      .wrap.entering .sheet {
        animation: unfold 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .wrap.entering .tape {
        animation: fade-in 0.12s ease-out both;
      }
      .wrap.leaving .sheet {
        animation: peel 0.16s ease-in forwards;
      }
      .wrap.leaving .tape {
        animation: fade-out 0.16s ease-in forwards;
      }
      @keyframes unfold {
        from {
          transform: translateY(-6px) scaleY(0.25);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes peel {
        to {
          transform: translateY(-10px) rotate(-2.5deg) scaleY(0.35);
          opacity: 0;
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }
      @keyframes fade-out {
        to {
          opacity: 0;
        }
      }
      .tape {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        height: 32px;
        min-width: 128px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-stretch: 112%;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: var(--kraft-text);
        cursor: grab;
      }
      .sheet {
        position: relative;
        isolation: isolate;
        padding: 30px 22px 22px;
        min-height: 200px;
      }
      .sheet.fallback {
        background: var(--kraft);
        border-radius: 10px;
      }
      .title {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      /* 播报の一言(「站起来」「坐下」)は離れていても読める大きさ */
      .announce {
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }
      .head {
        gap: 10px;
        min-height: 40px;
      }
      .head > * {
        white-space: nowrap;
      }
      .head .label {
        font-size: 15px;
        font-weight: 900;
      }
      .body {
        gap: 14px;
        margin-top: 6px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .heading {
        font-size: 20px;
        font-weight: 800;
      }
      /* 立っているときの小窓は「遠くから見る」:動作の名前を大きく */
      .heading.far {
        font-size: 26px;
        font-weight: 900;
        line-height: 1.15;
      }
      .small-timer {
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        color: var(--kraft-text-2);
      }
      /* この手順の残り秒(模板の大字 count-black、字高 40)と、第 N/M 步 */
      .count {
        gap: 10px;
        margin-top: 12px;
        margin-bottom: 6px;
        align-items: baseline;
        min-height: 48px;
      }
      .count .unit {
        font-size: 17px;
        font-weight: 900;
      }
      /* 数字が替わるたびに模板を一度「押す」(60 ms) */
      .tick-count {
        animation: stamp 0.06s ease-out;
      }
      @keyframes stamp {
        from {
          transform: scale(1.06);
        }
      }
      /* 手順が替わる:前の中身は左へ剥がれ、新しい中身は上から落ちる */
      .wrap.swap .body,
      .wrap.swap .count {
        animation: drop 0.14s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes drop {
        from {
          transform: translateY(-6px);
          opacity: 0;
        }
      }
      .wrap.swap .buttons {
        animation: fade-in 0.12s ease-out 0.08s both;
      }
      /* 「坐 | 站」の札 */
      .posture-chip {
        display: inline-flex;
        align-items: stretch;
        height: 26px;
        padding: 0;
        gap: 0;
        font-size: 13px;
        font-weight: 900;
        color: var(--kraft-text-2);
      }
      .posture-chip .half {
        position: relative;
        display: inline-flex;
        align-items: center;
        padding: 0 10px;
        min-width: 34px;
        justify-content: center;
      }
      .posture-chip .half.on {
        color: var(--white);
      }
      @media (prefers-reduced-motion: reduce) {
        .wrap.entering .sheet,
        .wrap.leaving .sheet,
        .wrap.swap .body,
        .wrap.swap .count,
        .tick-count {
          animation-duration: 0.01s;
          transform: none;
        }
      }
      .count .step-of {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--kraft-text-2);
      }
      /* 腹式呼吸:吸うと広がり、吐くと引く喷漆の溜まり(flood-teal の 8 枚を段で)。素材が無ければ下の円 */
      .breath-flood {
        width: 132px;
        height: 132px;
        flex: none;
        position: relative;
      }
      .breath-flood .paint-pool {
        position: absolute;
        inset: 4px;
        background: var(--teal);
        opacity: 0.92;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        /* 蒙版は明るさ(白 = 塗る)。素材の alpha は全部 255 */
        -webkit-mask-source-type: luminance;
        mask-mode: luminance;
        transition: transform 0.5s ease-in-out;
      }
      .breath-flood.inhale .paint-pool {
        transform: scale(1);
      }
      .breath-flood.exhale .paint-pool {
        transform: scale(0.94);
      }
      .breath-flood .ink-edge {
        position: absolute;
        inset: 0;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        background: rgba(22, 22, 21, 0.35);
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      .breath-ring {
        width: 132px;
        height: 132px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .breath-ring .ink {
        width: 118px;
        height: 118px;
        border-radius: 50%;
        border: 3px solid var(--kraft-text);
        background: rgba(22, 22, 21, 0.14);
        box-shadow: inset 0 0 0 6px rgba(22, 22, 21, 0.08);
        transform: scale(0.55);
      }
      .breath-ring.inhale .ink {
        animation: breath-in 4s cubic-bezier(0.45, 0, 0.55, 1) both;
      }
      .breath-ring.exhale .ink {
        animation: breath-out 6s cubic-bezier(0.45, 0, 0.55, 1) both;
      }
      @keyframes breath-in {
        from {
          transform: scale(0.55);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes breath-out {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(0.55);
        }
      }
      .text {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.45;
      }
      .muted {
        font-size: 12px;
        font-weight: 500;
        color: var(--kraft-text-2);
        line-height: 1.45;
      }
      .chip {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        color: var(--white);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
      }
      .buttons {
        gap: 12px;
        margin-top: 22px;
      }
      .dots {
        gap: 6px;
        align-items: center;
      }
      .breath-word {
        font-size: 30px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div id="wrap" class="wrap" data-drag>
      <div id="tape" class="tape"></div>
      <div id="sheet" class="sheet"></div>
    </div>
    <script type="module" src="js/posture.js"></script>
  </body>
</html>
